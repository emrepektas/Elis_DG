name: Check and publish static journey

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish this checked build to GitHub Pages
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
